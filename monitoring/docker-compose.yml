# Standalone monitoring stack for this host + the WoW containers — separate
# from the game stack's own docker-compose.yml so it can be started/stopped
# independently and doesn't need to touch the existing homelab reverse proxy
# in /opt/docker. Grafana is exposed directly on a host port instead.
services:
  prometheus:
    container_name: monitoring-prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # Host-level metrics: CPU, memory, disk, load, network — the same numbers
  # `uptime`/`free`/`df` show, but recorded over time instead of one snapshot.
  node-exporter:
    container_name: monitoring-node-exporter
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring

  # Per-container metrics for every container on this host (ac-worldserver,
  # ac-database, the whole media stack, everything) — what docker stats shows,
  # recorded over time instead of one-off snapshots.
  cadvisor:
    container_name: monitoring-cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    # Default housekeeping_interval (1s) plus tracking every systemd cgroup
    # slice on the host (not just Docker containers) measured at 70-125% CPU
    # on this 2-core (4-thread) host. docker_only=true skips non-Docker
    # cgroups entirely; 15s matches our Prometheus scrape_interval anyway.
    command:
      - '--housekeeping_interval=15s'
      - '--docker_only=true'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  # Log aggregation — single-binary mode (no separate distributor/ingester/
  # querier processes), which is the right scale for one host. Not exposed
  # on a host port: only Grafana and Promtail (both on this network) ever
  # need to reach it.
  loki:
    container_name: monitoring-loki
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - monitoring

  # Ships every container's logs to Loki. docker_sd_configs (see
  # promtail-config.yml) needs the Docker API to label entries with real
  # container names, so this gets a read-only docker.sock mount — the same
  # justified exception wake-proxy already makes elsewhere in this project,
  # granted only because there's no other way to get that information, and
  # read-only because Promtail only ever lists/inspects, never controls.
  promtail:
    container_name: monitoring-promtail
    image: grafana/promtail:latest
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/run/promtail
    networks:
      - monitoring
    depends_on:
      - loki

  grafana:
    container_name: monitoring-grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      # Placeholder for local access — change if this ever becomes reachable
      # beyond this host.
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

networks:
  monitoring:

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:
