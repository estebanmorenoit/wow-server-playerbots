services:
  ac-database:
    container_name: ac-database
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
    volumes:
      - ac-mysql-data:/var/lib/mysql
    networks:
      - ac-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ac-client-data-init:
    container_name: ac-client-data-init
    image: estebanmorenoit/ac-wotlk-client-data-playerbots:master
    volumes:
      - ac-client-data:/azerothcore/env/dist/data
    networks:
      - ac-network

  # One-shot: creates/updates acore_auth, acore_world, acore_characters. Run before
  # ac-worldserver/ac-authserver; exits when done (see depends_on below).
  ac-db-import:
    container_name: ac-db-import
    image: estebanmorenoit/ac-wotlk-db-import-playerbots:master
    environment:
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_characters"
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc
      - ./env/dist/logs:/azerothcore/env/dist/logs
    depends_on:
      ac-database:
        condition: service_healthy
    networks:
      - ac-network

  ac-authserver:
    container_name: ac-authserver
    image: estebanmorenoit/ac-wotlk-authserver-playerbots:master
    restart: unless-stopped
    environment:
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc
      - ./env/dist/logs:/azerothcore/env/dist/logs
    depends_on:
      ac-db-import:
        condition: service_completed_successfully
    ports:
      - "3724:3724"
    networks:
      - ac-network

  ac-worldserver:
    container_name: ac-worldserver
    image: estebanmorenoit/ac-wotlk-worldserver-playerbots:master
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_characters"
      # mod-playerbots creates/manages this database itself on first connect
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_playerbots"
      AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: "1"
      AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: "100"
      AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: "100"
      AC_AI_PLAYERBOT_SYNC_LEVEL_WITH_PLAYERS: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_CONCENTRATE_IN_PLAYER_ZONE: "1"
      # Greet disabled: mod-llm-chatter replaces built-in bot chat (see below).
      AC_AI_PLAYERBOT_ENABLE_GREET: "0"
      # Per-bot AI cost per tick (core default is 10) — tuned down for CPU headroom
      # on a 4-core host running 100 bots. Raise if you have cores to spare.
      AC_AI_PLAYERBOT_ITERATIONS_PER_TICK: "6"
    volumes:
      - ac-client-data:/azerothcore/env/dist/data
      - ./env/dist/etc:/azerothcore/env/dist/etc
      - ./env/dist/logs:/azerothcore/env/dist/logs
      - ./modules:/azerothcore/modules:ro
    depends_on:
      ac-db-import:
        condition: service_completed_successfully
      ac-client-data-init:
        condition: service_completed_successfully
    ports:
      - "7878:7878"
      - "8085:8085"
    networks:
      - ac-network

  # Python bridge for mod-llm-chatter: polls the DB for bot chat requests and calls
  # out to an LLM provider (Anthropic/OpenAI/Google/OpenRouter/Ollama). Builds from
  # the Dockerfile shipped in modules/mod-llm-chatter/tools/, which bakes its Python
  # deps in at build time instead of installing them on every container start. Needs
  # a real API key in env/dist/etc/modules/mod_llm_chatter.conf (copied from the
  # .dist template — never commit that file with a real key in it, and never bake
  # it into the image; it stays bind-mounted at runtime).
  ac-llm-chatter-bridge:
    container_name: ac-llm-chatter-bridge
    build:
      context: ./modules/mod-llm-chatter/tools
    networks:
      - ac-network
    volumes:
      - ./env/dist/etc/modules:/config:ro
      - ./env/dist/logs:/logs
    restart: unless-stopped
    depends_on:
      ac-database:
        condition: service_healthy

networks:
  ac-network:

volumes:
  ac-mysql-data:
  ac-client-data:
