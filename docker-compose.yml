services:
  ac-database:
    container_name: ac-database
    image: mysql:8.4
    restart: unless-stopped
    # Default innodb_buffer_pool_size (128MB) is smaller than this server's
    # actual data (~550MB across all 4 databases), forcing MySQL to evict and
    # re-read from disk on a host that has RAM to spare. 1G comfortably fits
    # the whole dataset in memory.
    command: --innodb-buffer-pool-size=1073741824
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
    volumes:
      - ac-mysql-data:/var/lib/mysql
    networks:
      - ac-network
    healthcheck:
      # "-h 127.0.0.1" (not "localhost") is load-bearing: mysql clients treat
      # the literal string "localhost" as "use the Unix socket", and MySQL's
      # entrypoint briefly runs a temporary, init-only server that listens
      # only on that socket (port 0, no TCP) before the real server starts on
      # 3306. On a fresh volume, "-h localhost" pings that temp server and
      # reports healthy ~2s before anything is actually listening on 3306,
      # which raced ac-db-import straight into a refused connection on a
      # from-scratch deploy. 127.0.0.1 forces TCP, which the temp server
      # doesn't expose at all, so this can only pass against the real one.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ac-client-data-init:
    container_name: ac-client-data-init
    image: estebanmorenoit/ac-wotlk-client-data-playerbots:master
    volumes:
      - ac-client-data:/azerothcore/env/dist/data
    networks:
      - ac-network

  # One-shot: creates/updates acore_auth, acore_world, acore_characters. Run before
  # ac-worldserver/ac-authserver; exits when done (see depends_on below).
  ac-db-import:
    container_name: ac-db-import
    image: estebanmorenoit/ac-wotlk-db-import-playerbots:master
    environment:
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_characters"
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc
      - ./env/dist/logs:/azerothcore/env/dist/logs
    depends_on:
      ac-database:
        condition: service_healthy
    networks:
      - ac-network

  ac-authserver:
    container_name: ac-authserver
    image: estebanmorenoit/ac-wotlk-authserver-playerbots:master
    restart: unless-stopped
    environment:
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc
      - ./env/dist/logs:/azerothcore/env/dist/logs
    depends_on:
      ac-db-import:
        condition: service_completed_successfully
    # No host port published — wake-proxy owns the real public 3724 and
    # reaches this container by its service name over ac-network.
    networks:
      - ac-network

  ac-worldserver:
    container_name: ac-worldserver
    image: estebanmorenoit/ac-wotlk-worldserver-playerbots:master
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Nothing capped this before — worldserver could (and did) take whatever
    # the host had, competing directly with the ~30 unrelated containers also
    # running here. CPU is the scarce resource on this box (4 threads total,
    # ~30 other containers), so 3 of those 4 threads mirrors
    # AC_MAP_UPDATE_THREADS below and leaves headroom for DB/auth/OS. RAM
    # isn't scarce here (host has ~19GB free at typical load) — 12g is well
    # above any observed usage (peaked ~4.5GB even with 4x the bots), just a
    # backstop against a genuine leak rather than a real constraint.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 12g
    environment:
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_characters"
      # mod-playerbots creates/manages this database itself on first connect
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_playerbots"
      # mod-individual-progression requires both of these (see its README) —
      # core-level settings, overridden here via AzerothCore's generic
      # AC_<KEY> config mechanism (verified in src/common/Configuration/Config.cpp)
      # rather than editing worldserver.conf directly, so a fresh deploy gets
      # them right without a manual step.
      AC_ENABLE_PLAYER_SETTINGS: "1"
      AC_DBC_ENFORCE_ITEM_ATTRIBUTES: "0"
      # Announces seasonal events (Brewfest, Hallow's End, etc.) server-wide in
      # chat when their window opens — doesn't affect whether events run, only
      # whether that's announced. Off by default in worldserver.conf.
      AC_EVENT_ANNOUNCE: "1"
      # Bots also buy from the AH, not just sell — so anything you list has
      # real bidders. BidAgainstPlayers stays at its default (false): bots
      # still bid, just won't escalate a bidding war against you specifically.
      AC_AUCTION_HOUSE_BOT_BUYER_ENABLED: "true"
      AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: "1"
      # Random bots are ambient world population (NPCs wandering zones), not
      # your party — those are recruited separately in-game and aren't capped
      # by this. Was bumped to 300 at some point without updating the limits
      # below; on this 4-thread host that alone pushed worldserver to ~236%
      # CPU with the host load average sustained above its thread count.
      # Dropped back down given this box also runs ~30 unrelated containers.
      AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: "75"
      AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: "75"
      # Idles all random bots out when no real player is connected instead of
      # simulating 75 bots' AI/pathing 24/7 — this alone was measured pinning
      # worldserver at ~193% CPU on this 4-thread host even with nobody
      # playing, which is what was driving the NUC's fan noise at rest.
      # Bots re-login 30s after a real player connects, log out 300s after
      # the last one disconnects — both stock module defaults.
      AC_AI_PLAYERBOT_DISABLED_WITHOUT_REAL_PLAYER: "1"
      AC_AI_PLAYERBOT_SYNC_LEVEL_WITH_PLAYERS: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_CONCENTRATE_IN_PLAYER_ZONE: "1"
      # Greet disabled: mod-llm-chatter replaces built-in bot chat (see below).
      AC_AI_PLAYERBOT_ENABLE_GREET: "0"
      # Per-bot AI cost per tick (core default is 10). Total AI cost scales as
      # bots x IterationsPerTick; this host is 4 threads shared with other
      # services, so bot count and iterations are balanced together rather
      # than raised independently — measure headroom (docker stats / server
      # info uptime diff) before increasing either further.
      AC_AI_PLAYERBOT_ITERATIONS_PER_TICK: "6"
      # DataDir defaults to "." which resolves against the image's WorkingDir
      # (/azerothcore), not against the client-data volume mounted below —
      # without this the world server fails "Failed to find map files for
      # starting areas" even though the volume has real data in it.
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      # Default is 1 (single-threaded map/world updates) — that pins the whole
      # game-tick loop, playerbot AI included, to one core no matter how many
      # cores the host has. Set to 3 of this host's 4 cores so world updates
      # (multiple continents/instances/battlegrounds) can actually spread out;
      # left at 1 core's worth of headroom for DB/auth/OS overhead.
      AC_MAP_UPDATE_THREADS: "3"
    volumes:
      - ac-client-data:/azerothcore/env/dist/data
      - ./env/dist/etc:/azerothcore/env/dist/etc
      - ./env/dist/logs:/azerothcore/env/dist/logs
      - ./modules:/azerothcore/modules:ro
    depends_on:
      ac-db-import:
        condition: service_completed_successfully
      ac-client-data-init:
        condition: service_completed_successfully
    ports:
      # 7878 (SOAP admin console) — admin tooling, not client-facing.
      - "7878:7878"
      # 8085 (world) is NOT published here — wake-proxy owns it.
    networks:
      - ac-network

  # Python bridge for mod-llm-chatter: polls the DB for bot chat requests and calls
  # out to an LLM provider (Anthropic/OpenAI/Google/OpenRouter/Ollama). Builds
  # straight from mod-llm-chatter's tools/ directory on GitHub (no local clone
  # needed for this piece), baking Python deps in at image-build time instead of
  # installing them on every container start. Needs a real API key in
  # env/dist/etc/modules/mod_llm_chatter.conf (copied from the .dist template —
  # never commit that file with a real key in it, and never bake it into the
  # image; it stays bind-mounted at runtime). Waits on ac-db-import finishing
  # (not just ac-database being healthy) so it never races the module's table
  # creation on a fresh install. Gated behind the "llm-chatter" profile so a
  # bare `docker compose up -d` doesn't start it before it's configured;
  # deploy.sh adds --profile llm-chatter automatically once you give it a key.
  ac-llm-chatter-bridge:
    container_name: ac-llm-chatter-bridge
    build:
      context: https://github.com/Hokken/mod-llm-chatter.git#master:tools
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        ENV PYTHONUNBUFFERED=1
        CMD ["python", "llm_chatter_bridge.py", "--config", "/config/mod_llm_chatter.conf"]
    networks:
      - ac-network
    volumes:
      - ./env/dist/etc/modules:/config:ro
      - ./env/dist/logs:/logs
    restart: unless-stopped
    profiles: ["llm-chatter"]
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully

  # Always-on TCP relay for the two client-facing ports (3724 auth, 8085
  # world) plus an idle-shutdown watcher — the only game-stack service that
  # never gets stopped. Lets the whole stack sit fully stopped between play
  # sessions (quiet host, no idle CPU/heat) while still being reachable:
  # the first WoW client connection attempt transparently boots everything
  # else, and it auto-stops the rest again 15 minutes after everyone
  # disconnects. See wake-proxy/wake_proxy.py for the full design notes.
  #
  # Needs the host's Docker socket (to run `docker compose` against sibling
  # containers — this is socket-mounted "docker outside of docker", not
  # real DinD) and this same directory mounted at the IDENTICAL absolute
  # host path, because this compose file's relative bind mounts (./env/...
  # etc.) get resolved against that path and then applied by the HOST's
  # dockerd — a mismatched path here would silently break those mounts the
  # next time this container starts the stack.
  wake-proxy:
    container_name: ac-wake-proxy
    build: ./wake-proxy
    restart: unless-stopped
    environment:
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-password}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/home/esteban/azerothcore-playerbots:ro
    ports:
      - "3724:3724"
      - "8085:8085"
    networks:
      - ac-network

networks:
  ac-network:

volumes:
  ac-mysql-data:
  ac-client-data:
